      // 첫 화면이 번쩍이지 않도록 지난번 배경색을 먼저 칠한다
      try {
        var bg = localStorage.getItem('preview.hoedok.bg');
        if (bg) {
          document.documentElement.style.background = bg;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        }
        // 시작 화면 색·속도: 지난번 디자인 색과 움직임 설정 (미리 보기는 저장 이름 앞에 preview.)
        var P = document.documentElement.hasAttribute('data-preview') ? 'preview.' : '';
        var st = document.documentElement.style;
        if (bg) st.setProperty('--sp-bg', bg);
        var ink = localStorage.getItem(P + 'hoedok.ink'), ac = localStorage.getItem(P + 'hoedok.ac');
        if (ink) st.setProperty('--sp-ink', ink);
        if (ac) st.setProperty('--sp-ac', ac);
        var dev = JSON.parse(localStorage.getItem(P + 'hoedok.device.v1') || 'null') || {};
        var lv = dev.motion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'normal');
        st.setProperty('--sp-f', 1); // 움직임 규칙: 속도는 하나 (켜기/끄기만)
        if (lv === 'off') document.documentElement.classList.add('sp-still');
        // 설치 후 처음 한 번만: 자세한 소개 (할 일이 체크될 때마다 진도 칸이 채워짐). 본 뒤에는 짧은 시작 화면
        if (!localStorage.getItem(P + 'hoedok.intro')) document.documentElement.classList.add('sp-intro');
      } catch (e) {}
